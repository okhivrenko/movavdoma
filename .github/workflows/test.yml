name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Tests and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
